<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Letters · Monthly Depths</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="shark.ico" type="image/x-icon">
</head>
<body>
<div class="book-wrapper">
    <!-- little shark tooth row -->
    <div class="shark-decoration">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="letter-card" id="letterCard">
        <div class="shark-icon">🦈 ✦ ˑ ༄  ˑ ✦</div>
        <div class="month-header" id="monthTitle">Introdução</div>
        <!-- main letter text inserted here -->
        <div class="letter-text" id="letterContent"></div>
        <div class="month-image-container">
        <img id="monthImage" src="" alt="Imagem do mês" class="month-image">
    </div>
        <div class="signature-line">made with love.</div>
    </div>

    <!-- monthly footprint -->
    <div class="fin-print">
        <span>⌇⌇⌇</span>
        <span>🦈 🦈 🦈</span>
        <span>⌇⌇⌇</span>
    </div>

    <!-- navigation buttons -->
    <div class="navigation">
        <button class="nav-btn" id="prevBtn" aria-label="mês anterior" title="voltar mês">◀</button>
        <span class="page-indicator" id="pageIndicator">1 / 8</span>
        <button class="nav-btn" id="nextBtn" aria-label="próximo mês" title="avançar mês">▶</button>
    </div>
    <div class="footer-note">carta aberta para meu amor ⋆˖⁺‧₊☽◯☾₊‧⁺˖⋆</div>
</div>

<script src="script.js"></script>
</body>
</html>
